<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: http: data:; media-src https: http:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'">
<meta name="referrer" content="no-referrer">
<title>阅读器</title><link rel="stylesheet" href="reader.css">
</head><body class="sepia serif">
<div class="bar" id="bar">
  <button id="smaller" title="缩小文本">A−</button><button id="bigger" title="放大文本">A+</button>
  <span class="sep"></span>
  <button class="theme" data-theme="light" title="白色"><i></i></button>
  <button class="theme" data-theme="sepia" title="米色"><i></i></button>
  <button class="theme" data-theme="gray" title="灰色"><i></i></button>
  <button class="theme" data-theme="dark" title="夜间"><i></i></button>
  <span class="sep"></span>
  <button id="font" title="字体">Aa</button>
  <button id="exit" title="隐藏阅读器（Ctrl+Shift+R）">完成</button>
</div>
<article id="article"><p class="loading">正在载入…</p></article>
<script src="ui.js"></script><script src="reader.js"></script>
</body></html>
