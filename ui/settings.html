<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>设置</title><link rel="stylesheet" href="ui.css">
<style>
.layout{display:flex;gap:28px;align-items:flex-start}
nav{width:180px;flex:none;position:sticky;top:30px}
nav a{display:block;padding:7px 12px;border-radius:8px;color:var(--muted)}
nav a:hover{background:var(--hover);color:var(--text)}
.main{flex:1;min-width:0}
.main section{scroll-margin-top:20px}
.setting{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px solid #ffffff10}
.setting:last-child{border-bottom:0}
.setting .label{flex:1}
.setting .label small{display:block;color:var(--muted);font-size:12px}
.setting input[type=text],.setting input[type=url]{width:300px}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#ffffff26;border-radius:12px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(16px)}
.restart{color:#ffd479;font-size:12px}
</style></head><body>
<div class="page" style="max-width:1000px">
  <h1>设置</h1>
  <div class="layout">
    <nav><a href="#general">通用</a><a href="#tabs">标签页</a><a href="#search">搜索</a><a href="#start">起始页</a><a href="#privacy">隐私</a><a href="#reader">阅读器</a><a href="#advanced">高级</a></nav>
    <div class="main" id="main"></div>
  </div>
</div>
<script src="ui.js"></script><script src="settings.js"></script>
</body></html>
