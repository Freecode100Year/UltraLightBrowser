<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>设置</title><link rel="stylesheet" href="ui.css">
<style>
.layout{display:flex;gap:28px;align-items:flex-start}
nav{width:180px;flex:none;position:sticky;top:30px}
nav a{display:block;padding:7px 12px;border-radius:8px;color:var(--muted)}
nav a:hover{background:var(--hover);color:var(--text)}
.main{flex:1;min-width:0}
.main section{scroll-margin-top:20px}
.setting{display:flex;align-items:center;gap:16px;padding:12px 4px;border-bottom:1px solid #ffffff10}
.setting:last-child{border-bottom:0}
.setting .label{flex:1}
.setting .label small{display:block;color:var(--muted);font-size:12px}
.setting input[type=text],.setting input[type=url]{width:300px}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#ffffff26;border-radius:12px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:disabled+span{opacity:.4;cursor:default}
.switch input:checked+span:before{transform:translateX(16px)}
.restart{color:#ffd479;font-size:12px}
.list .item small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .item.current{background:#3d8bfd14}
.tag{display:inline-block;margin-left:8px;padding:0 7px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;vertical-align:1px}
.lat{flex:none;font-size:12px;padding:1px 8px;border-radius:9px;background:#ffffff10}
.lat.good{color:var(--ok)}.lat.mid{color:#ffd479}.lat.slow{color:#ff9f5a}.lat.bad{color:var(--danger)}
.setting select{max-width:320px}
small.bad{display:block;color:var(--danger)}
small.warn{display:block;color:#ffd479}
.list .item small.wrap,small.wrap{display:block;white-space:normal}
.list .item.rec{align-items:flex-start}.list .item.rec button{flex:none;min-width:64px}
.list .item .more{flex:none;color:var(--accent);font-size:13px;padding-top:6px}
h3{font-size:14px;margin:6px 4px 6px}
</style></head><body>
<div class="page" style="max-width:1000px">
  <h1>设置</h1>
  <div class="layout">
    <nav><a href="#general">通用</a><a href="#tabs">标签页</a><a href="#search">搜索</a><a href="#start">起始页</a><a href="#network">网络</a><a href="#lines">我的线路</a><a href="#extensions">扩展程序</a><a href="#scripts">用户脚本</a><a href="#privacy">隐私</a><a href="#reader">阅读器</a><a href="#advanced">高级</a></nav>
    <div class="main" id="main"></div>
  </div>
</div>
<script src="ui.js"></script><script src="settings.js"></script>
</body></html>
