name: Build & Release UltraLightBrowser

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@17d6beb0142f0371858976c178033f915525e692 # v2.0.1

      - name: Restore NuGet Packages
        run: |
          nuget restore packages.config -PackagesDirectory packages

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum
      - name: Build WARP helper
        shell: pwsh
        run: go build -C warp -trimpath -ldflags "-s -w -buildid=" -o bin/ulb-warp.exe .
      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release --parallel

      - name: Verify Binary
        run: |
          if (Test-Path "build\Release\UltraLightBrowser.exe") {
            Write-Host "Build succeeded: build\Release\UltraLightBrowser.exe exists." -ForegroundColor Green
            Get-Item "build\Release\UltraLightBrowser.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "UltraLightBrowser.exe not found!"
            exit 1
          }

      - name: Package Distribution ZIP & Generate Checksums
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name || github.ref_name }}"
          if (-not $tag -or $tag -eq "main") { $tag = "latest" }
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          
          # Copy target executable and license/readme
          Copy-Item "build\Release\UltraLightBrowser.exe" -Destination "dist\"
          if (Test-Path "build\Release\WebView2Loader.dll") {
            Copy-Item "build\Release\WebView2Loader.dll" -Destination "dist\"
          }
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "dist\" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "dist\" }
          
          $zipName = "UltraLightBrowser-$tag-windows-x64.zip"
          Compress-Archive -Path "dist\*" -DestinationPath "build\Release\$zipName" -Force
          Write-Host "Created archive: build\Release\$zipName"

          # Generate SHA256 checksums
          Get-FileHash -Algorithm SHA256 "build\Release\UltraLightBrowser.exe", "build\Release\$zipName" |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "build\Release\SHA256SUMS.txt"
          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content "build\Release\SHA256SUMS.txt"

      - name: Generate Build Provenance Attestation
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: |
            build/Release/UltraLightBrowser.exe
            build/Release/*.zip
            build/Release/SHA256SUMS.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: UltraLightBrowser-Windows-x64
          path: |
            build/Release/UltraLightBrowser.exe
            build/Release/*.zip
            build/Release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: UltraLightBrowser ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/Release/UltraLightBrowser.exe
            build/Release/*.zip
            build/Release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
