name: flags-probe
on:
  push:
    branches: [feat/chromium-flags]
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to probe
        default: v2.2.3
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download ${{ inputs.release || 'v2.2.3' }} -R ${{ github.repository }} -p UltraLightBrowser.exe -D rel
      - name: Probe
        run: ./tests/flags-probe.ps1 -Exe rel\UltraLightBrowser.exe
