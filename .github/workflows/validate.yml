name: Validate changes

on:
  pull_request:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  power-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile production PowerManager with deterministic API stubs
        run: g++ -std=c++20 -Wall -Wextra -Werror -Itests/stubs -Isrc tests/power_manager_test.cpp src/PowerManager.cpp -o power-tests
      - name: Run lifecycle and process tree regression tests
        run: ./power-tests

  window-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test UA profile versions and restoration
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/user_agent_test.cpp -o ua-tests
          ./ua-tests
      - name: Test fullscreen and maximized client bounds
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/window_geometry_test.cpp -o geometry-tests
          ./geometry-tests

  audio-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test actual injected audio script
        run: |
          node tests/audio_enhancer_test.cjs
          node tests/verify_audio_response.mjs
          python3 tests/audio_registration_test.py

  windows-build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: nuget/setup-nuget@17d6beb0142f0371858976c178033f915525e692 # v2.0.1
      - name: Restore packages
        run: nuget restore packages.config -PackagesDirectory packages
      - name: Configure native Windows application
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64
      - name: Compile and link with real Windows SDK and WebView2
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
