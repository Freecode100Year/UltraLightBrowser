name: Validate changes

on:
  pull_request:
  push:
    branches:
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  power-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile production PowerManager with deterministic API stubs
        run: g++ -std=c++20 -Wall -Wextra -Werror -Itests/stubs -Isrc tests/power_manager_test.cpp src/PowerManager.cpp -o power-tests
      - name: Run lifecycle and process tree regression tests
        run: ./power-tests

  window-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test UA profile versions and restoration
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/user_agent_test.cpp -o ua-tests
          ./ua-tests
      - name: Test the user library (bookmarks, history, sites, privacy)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/library_test.cpp src/Library.cpp -o library-tests
          ./library-tests
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - name: Test ad and tracker blocking rules
        run: |
          cargo test --manifest-path rust/adblock/Cargo.toml --locked
          cargo build --release --manifest-path rust/adblock/Cargo.toml --locked
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/adblock_rules_test.cpp src/AdBlockRules.cpp rust/adblock/target/release/libulb_adblock.a -ldl -lpthread -lm -o adblock-tests
          ./adblock-tests
          node tests/adblock_scripts_test.cjs
      - name: Check embedded built-in pages
        run: |
          python3 tests/ui_resources_test.py
          python3 tests/f8964_pack_test.py
      - name: Test fullscreen and maximized client bounds
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/window_geometry_test.cpp -o geometry-tests
          ./geometry-tests

  audio-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test actual injected audio script
        run: |
          node tests/video_diagnostics_test.cjs
          node tests/audio_enhancer_test.cjs
          node tests/verify_audio_response.mjs
          node tests/true_peak_limiter_test.cjs
          node tests/room_impulse_test.cjs
          g++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/audio_endpoint_test.cpp -o audio-endpoint-tests
          ./audio-endpoint-tests
          python3 tests/audio_registration_test.py

  windows-build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: nuget/setup-nuget@17d6beb0142f0371858976c178033f915525e692 # v2.0.1
      - name: Restore packages
        run: nuget restore packages.config -PackagesDirectory packages
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: warp/go.mod
          cache-dependency-path: warp/go.sum
      - name: Build WARP helper
        shell: pwsh
        run: |
          go vet -C warp ./...
          go test -C warp ./...
          go build -C warp -trimpath -ldflags "-s -w -buildid=" -o bin/ulb-warp.exe .
      - name: Offline freedom8964.com snapshot (start page entry)
        run: python tools/pack_f8964.py resources/f8964.pack
      - name: Configure native Windows application
        run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64
      - name: Compile and link with real Windows SDK and WebView2
        run: cmake --build build --config ${{ matrix.configuration }} --parallel
      - name: Stage portable Release output
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $directory = 'dist/Release'
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          Copy-Item 'build/Release/UltraLightBrowser.exe' $directory -Force
          $loader = 'build/Release/WebView2Loader.dll'
          if (Test-Path $loader) { Copy-Item $loader $directory -Force }
          Copy-Item 'LICENSE' $directory -Force
          Copy-Item 'FULL_VERSION_GUIDE.md' $directory -Force
      - name: Upload Release executable
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: UltraLightBrowser-Windows-x64
          path: dist/Release/*
          if-no-files-found: error
